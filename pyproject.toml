[project]
name = "fastbook-workspace"
version = "0.1.0"
description = "The fastai book - Introduction to deep learning with fastai and PyTorch"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
authors = [
    { name = "Jeremy Howard" },
    { name = "Sylvain Gugger" }
]

dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "fastbook",
    "fastai>=2.0.0",
    "graphviz",
    "ipywidgets",
    "matplotlib",
    "nbdev>=0.2.12",
    "pandas",
    "scikit-learn",
    "azure-cognitiveservices-search-imagesearch",
    "sentencepiece",
    "jupyter",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest",
    "nbformat",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["utils.py", "tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
